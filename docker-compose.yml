services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: noise
      POSTGRES_PASSWORD: noise
      POSTGRES_DB: noise_checker
    ports:
      - "5455:5432"
    volumes:
      - noise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noise -d noise_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noise_pgdata:
