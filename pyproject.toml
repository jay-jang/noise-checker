[project]
name = "noise-checker"
version = "0.0.1"
description = "한국어 악성 커뮤니티 용어/표식 검출 자문 API — M0 기반"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "jsonschema>=4.21",
    "referencing>=0.35",
    "kiwipiepy>=0.23.1",
]

[project.optional-dependencies]
console = [
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noise_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: PostgreSQL이 필요한 테스트 (마이그레이션 검증 — DB 없으면 skip)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]  # 에이전트 worktree 중첩 디렉토리 스캔 제외

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
